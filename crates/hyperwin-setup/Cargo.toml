[package]
name = "hyperwin-setup"
description = "hyperWIN's installer: one program to double-click, which checks the PC and installs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No dependency on the other crates: it carries their programs (build.rs) and runs
# `hyperwin.exe install`.
[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
