[package]
name = "hyperwin-guest"
description = "The connection between hyperWIN's helper in a guest and the host: Hyper-V sockets and the framing on them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No dependencies but the sockets: the helper in the guest (guest/) and the host both build on it.
[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
] }
